<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>အချစ်ဆုံးလေးရဲ့ Gallery ❤️</title>
<style>
body {
 margin:0;
 font-family:sans-serif;
 background:linear-gradient(135deg,#fff0f5,#fce4ec);
 color:#81445d;
 text-align:center;
}
header {padding:40px 12px 20px}
h1 {color:#c0527c;font-size:28px}
header p {color:#986b7e}
.gallery {
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
 padding:15px;
 max-width:850px;
 margin:auto;
}
.gallery img {
 width:100%;
 height:270px;
 object-fit:cover;
 border:7px solid white;
 border-radius:15px;
 box-shadow:0 5px 15px #0002;
}
footer {padding:30px;color:#c0527c}
</style>
</head>
<body>
<header>
<h1>အချစ်ဆုံးလေးရဲ့ Gallery ❤️</h1>
<p>မင်းရဲ့အမှတ်တရလေးတွေကို ချစ်ခြင်းများစွာနဲ့ စုစည်းထားပါတယ် 🌸</p>
</header>
<div class="gallery">
<img src="IMG_20260801_222632_273.jpg">
<img src="IMG_20260801_222632_497.jpg">
<img src="IMG_20260801_222632_566.jpg">
<img src="IMG_20260801_222632_858.jpg">
<img src="IMG_20260719_185541_383.jpg">
<img src="IMG_20260719_105732_656.jpg">
</div>
<footer>
မင်းက ကိုယ့်အတွက် အမြဲတမ်းထူးခြားနေမှာပါ ❤️
</footer>
</body>
</html>
